plugins {
    id 'java-library'
}

group = 'io.github.dsheirer'

// The release version is set in gradle.properties.  Workflows pass -Pversion for tagged, nightly and pull request builds.
version = providers.gradleProperty('version').get()

base {
    archivesName = 'radio-reference-api'
}

java {
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.23.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.23.0'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.23'
    implementation 'org.slf4j:slf4j-api:2.0.20'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.6.6'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

/**
 * Offline tests always run.  Tests tagged 'live' call the radioreference.com web service and only run when requested
 * with -PliveTests, using credentials stored in your gradle.properties file as radio.reference.user and
 * radio.reference.password
 */
tasks.named('test', Test) {
    boolean liveTests = providers.gradleProperty('liveTests').isPresent()
    useJUnitPlatform {
        if(!liveTests)
        {
            excludeTags 'live'
        }
    }
    environment('RADIO_REFERENCE_USER', providers.gradleProperty('radio.reference.user').getOrElse(''))
    environment('RADIO_REFERENCE_PASSWORD', providers.gradleProperty('radio.reference.password').getOrElse(''))
}

tasks.named('jar', Jar) {
    manifest {
        attributes 'Implementation-Title': 'radio-reference-api',
                   'Implementation-Version': project.version
    }
}
