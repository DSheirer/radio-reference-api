# Publishes a release when a version tag is pushed. The tag sets the version of
# the jars. Its major version has to match the major version in
# gradle.properties, which follows the RadioReference API version: with
# version=18.1.0, v18.2.0 or v18.2.1 make a release and v18.3.0-rc1 a
# pre-release, while v19.0.0 is rejected.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          base="$(sed -n 's/^version=//p' gradle.properties)"
          major="${base%%.*}"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v${major}\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a v${major}.<minor>.<patch> version (major version ${major} from version=${base} in gradle.properties)"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd jars && sha256sum * > SHA256SUMS)
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" jars/* "${prerelease[@]}" \
            --verify-tag --generate-notes --title "radio-reference-api ${GITHUB_REF_NAME#v}"
