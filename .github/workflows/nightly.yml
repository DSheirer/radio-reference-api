# Publishes the rolling "nightly" pre-release from master. Runs when a pull
# request is merged and on a daily schedule; the schedule skips when the nightly
# release was already built from the current commit.
name: Nightly

on:
  push:
    branches: [master]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # Fails when the live WSDL differs from the copy the code was written against,
  # so API changes show up as a failed nightly run. Independent of the release.
  wsdl-drift:
    name: WSDL drift check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Compare the live WSDL with src/main/wsdl
        run: |
          version="$(ls src/main/wsdl/radioreference-v*.wsdl | sed 's/.*-v\([0-9]*\)\.wsdl/\1/')"
          committed="src/main/wsdl/radioreference-v${version}.wsdl"
          curl -sS --fail --retry 3 --retry-all-errors -m 60 -o live.wsdl \
            "https://api.radioreference.com/soap2/?wsdl&v=${version}"
          if cmp -s "$committed" live.wsdl; then
            echo "WSDL v${version} matches the committed copy" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## RadioReference WSDL v${version} changed"
            echo
            echo "Review the changes, update the library, then replace \`${committed}\` with the live WSDL."
            echo
            echo '```diff'
            diff -u "$committed" live.wsdl | head -500 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::The live RadioReference WSDL v${version} differs from ${committed}; see the job summary"
          exit 1

  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base="$(sed -n 's/^version=//p' gradle.properties)"
          marker="Built from ${GITHUB_SHA}"
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] &&
             gh release view nightly --json body --jq .body 2>/dev/null | grep -qF "$marker"; then
            build=false
          fi
          {
            echo "build=$build"
            echo "version=${base}-nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars

      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd jars && sha256sum * > SHA256SUMS)
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly jars/* --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "Nightly $VERSION" \
            --notes "Automated build of master. Not for production use.

          Built from ${GITHUB_SHA}"
